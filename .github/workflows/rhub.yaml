# R-hub's generic GitHub Actions workflow file. It's canonical location is at
# https://github.com/r-hub/actions/blob/v1/workflows/rhub.yaml
# You can update this file to a newer version using the rhub2 package:
#
# rhub::rhub_setup()
#
# It is unlikely that you need to modify this file manually.

name: R-hub
run-name: 'R-hub: all 36 platforms (0a336a0)'

on:
  push:
    branches: [codex/rhub-all-0a336a0]

permissions:
  contents: read

jobs:

  setup:
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.rhub-setup.outputs.containers }}
      platforms: ${{ steps.rhub-setup.outputs.platforms }}

    steps:
    # NO NEED TO CHECKOUT HERE
    - uses: r-hub/actions/setup@v1
      with:
        config: 'ubuntu-clang,ubuntu-gcc12,ubuntu-next,ubuntu-release,atlas,c23,clang-asan,clang-ubsan,clang16,clang17,clang18,clang19,clang20,clang21,clang22,clang23,gcc13,gcc14,gcc15,gcc16,gcc-asan,lto,nold,noremap,valgrind,mkl,intel,donttest,nosuggests,rchk,vnu,windows,macos,macos-arm64,linux,m1-san'
      id: rhub-setup

  linux-containers:
    needs: setup
    if: ${{ needs.setup.outputs.containers != '[]' }}
    runs-on: ubuntu-latest
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.containers) }}
    container:
      image: ${{ matrix.config.container }}

    steps:
      - uses: r-hub/actions/checkout@v1
        with:
          ref: 0a336a00abc607f1a94742455baae4a6ff1f00a8
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      # Frozen prerelease R images cannot load vctrs 0.7.2's binding API.
      # Keep current vctrs on all other platforms.
      - uses: r-hub/actions/setup-deps@v1
        with:
          extra-packages: >-
            any::rcmdcheck,
            ${{ contains(fromJSON('["c23","clang16","clang17","clang18","clang19","clang20","gcc15","noremap"]'), matrix.config.name) && 'vctrs@0.7.1' || '' }}
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/run-check@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}

  other-platforms:
    needs: setup
    if: ${{ needs.setup.outputs.platforms != '[]' }}
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.platforms) }}

    steps:
      - uses: r-hub/actions/checkout@v1
        with:
          ref: 0a336a00abc607f1a94742455baae4a6ff1f00a8
      - uses: r-hub/actions/setup-r@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/setup-deps@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - uses: r-hub/actions/run-check@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
